name: 双沙箱保活

# 根治 GitHub 免费定时被延迟(实际4~6h一次)导致沙箱休眠掉线的问题：
# job 一旦被触发，就在 job 内部每 2 分钟踩一次两个沙箱，持续约 5.5 小时；
# 结束前通过 API 自我 dispatch 拉起下一轮，形成不间断接力链。
# 链一旦建立就不再依赖不准的 schedule；schedule 只作每天几次的断链兜底。
# 仓库为 public，Actions 分钟数免费，长驻循环不产生费用。
on:
  schedule:
    - cron: '17 0,6,12,18 * * *'   # 每天4次兜底重启链，错开整点
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    name: 长驻保活(踩A+踩B)+自我接力
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: 循环踩两个沙箱并自我接力
        env:
          URL_A: ${{ secrets.URL_A }}
          URL_B: ${{ secrets.URL_B }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          echo "===== 保活链启动 $(date -u '+%F %T UTC') ====="
          ja=/tmp/ca.txt; jb=/tmp/cb.txt
          rm -f "$ja" "$jb"
          oka=0; okb=0
          for i in $(seq 1 165); do
            ca=$(curl -skL --max-time 30 -c "$ja" -b "$ja" \
                   -o /dev/null -w "%{http_code}" "${URL_A}&ping=$(date +%s%N)")
            cb=$(curl -skL --max-time 30 -c "$jb" -b "$jb" \
                   -o /dev/null -w "%{http_code}" "${URL_B}&ping=$(date +%s%N)")
            ts=$(date -u '+%F %T')
            echo "[$ts] 第 $i 轮 → A=$ca B=$cb"
            [ "$ca" = "200" ] && oka=$((oka+1))
            [ "$cb" = "200" ] && okb=$((okb+1))
            sleep 120
          done
          echo "===== 一轮结束 $(date -u '+%F %T UTC') A成功=$oka/165 B成功=$okb/165 ====="
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/workflows/keepalive.yml/dispatches" \
            -d '{"ref":"main"}' -w "自我接力 dispatch → HTTP %{http_code}\n"
