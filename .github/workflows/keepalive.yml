name: 大肥鱼保活

# 根治 GitHub 免费定时被延迟(实际4~6h一次)导致沙箱休眠掉线的问题：
# job 一旦被触发，就在 job 内部每 2 分钟踩一次本沙箱的四个页面端口，
# 持续约 5.5 小时；结束前通过 PAT 自我 dispatch 拉起下一轮，形成不间断接力链。
# 链一旦建立就不再依赖不准的 schedule；schedule 只作每天几次的断链兜底。
# 单链保护：任何时刻只有一个 run，防止兜底定时与接力叠加出并行链。
# 仓库为 public，Actions 分钟数免费，长驻循环不产生费用。
on:
  schedule:
    - cron: '17 0,6,12,18 * * *'   # 每天4次兜底重启链，错开整点
  workflow_dispatch:

concurrency:
  group: fish-keepalive
  cancel-in-progress: true

permissions:
  actions: write

jobs:
  keepalive:
    name: 长驻保活(8000/8001/8002/8003)+自我接力
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: 循环踩四个页面端口并自我接力
        env:
          URL_8000: ${{ secrets.URL_A }}
          URL_8001: ${{ secrets.URL_8001 }}
          URL_8002: ${{ secrets.URL_8002 }}
          URL_8003: ${{ secrets.URL_8003 }}
          GH_TOKEN: ${{ secrets.KEEP_PAT }}
          REPO: ${{ github.repository }}
        run: |
          echo "===== 保活链启动 $(date -u '+%F %T UTC') ====="
          OK8000=0; OK8001=0; OK8002=0; OK8003=0
          for i in $(seq 1 165); do
            line="[$(date -u '+%F %T')] 第 $i 轮"
            for p in 8000 8001 8002 8003; do
              case "$p" in
                8000) url="$URL_8000"; jar=/tmp/c8000.txt;;
                8001) url="$URL_8001"; jar=/tmp/c8001.txt;;
                8002) url="$URL_8002"; jar=/tmp/c8002.txt;;
                8003) url="$URL_8003"; jar=/tmp/c8003.txt;;
              esac
              code=$(curl -skL --max-time 30 -c "$jar" -b "$jar" \
                       -o /dev/null -w "%{http_code}" "${url}&ping=$(date +%s%N)")
              case "$p" in
                8000) [ "$code" = "200" ] && OK8000=$((OK8000+1));;
                8001) [ "$code" = "200" ] && OK8001=$((OK8001+1));;
                8002) [ "$code" = "200" ] && OK8002=$((OK8002+1));;
                8003) [ "$code" = "200" ] && OK8003=$((OK8003+1));;
              esac
              line="$line  ${p}=${code}"
            done
            echo "$line"
            sleep 120
          done
          echo "===== 一轮结束 $(date -u '+%F %T UTC') 累计成功: 8000=$OK8000 8001=$OK8001 8002=$OK8002 8003=$OK8003 /165 ====="
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/workflows/keepalive.yml/dispatches" \
            -d '{"ref":"main"}' -w "自我接力 dispatch → HTTP %{http_code}\n"
